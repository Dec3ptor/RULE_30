<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cellular Automata</title>
  <meta name="description" content="Interactive cellular automata in your browser: Rule 30 and the other elementary rules, traffic jams, the Game of Life, Langton's ant, Wireworld, snowflakes, reaction–diffusion, the BZ reaction, fractal growth, sandpiles, forest fires and the Ising model.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./">
        <svg class="logo" viewBox="0 0 15 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M7 0h1v1h-1zM6 1h1v1h-1zM7 1h1v1h-1zM8 1h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM9 2h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM7 3h1v1h-1zM8 3h1v1h-1zM9 3h1v1h-1zM10 3h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM7 4h1v1h-1zM11 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM5 5h1v1h-1zM6 5h1v1h-1zM7 5h1v1h-1zM8 5h1v1h-1zM10 5h1v1h-1zM11 5h1v1h-1zM12 5h1v1h-1zM1 6h1v1h-1zM2 6h1v1h-1zM5 6h1v1h-1zM10 6h1v1h-1zM13 6h1v1h-1zM0 7h1v1h-1zM1 7h1v1h-1zM3 7h1v1h-1zM4 7h1v1h-1zM5 7h1v1h-1zM6 7h1v1h-1zM9 7h1v1h-1zM10 7h1v1h-1zM11 7h1v1h-1zM12 7h1v1h-1zM13 7h1v1h-1zM14 7h1v1h-1z"/></svg>
        <span>
          <span class="title">Cellular Automata</span>
          <span class="subtitle">Simple rules, complex patterns. Everything runs in your browser.</span>
        </span>
      </a>
      <a class="gh-link" href="https://github.com/Dec3ptor/RULE_30" rel="noopener">Source</a>
    </div>
    <nav class="wrap algo-nav" id="algoNav" aria-label="Algorithms"></nav>
  </header>

  <main class="wrap layout">
    <div class="stage" role="region" aria-label="Simulation">
      <div class="stick-sentinel" id="stickSentinel" aria-hidden="true"></div>
      <div class="stage-top" id="stageTop">
        <div class="canvas-box" id="canvasBox">
          <canvas id="canvas" aria-label="Cellular automaton"></canvas>
        </div>

        <div class="toolbar">
          <button type="button" id="playBtn" class="btn primary"></button>
          <button type="button" id="stepBtn" class="btn compact" title="Step" aria-label="Step"></button>
          <button type="button" id="resetBtn" class="btn compact" title="Reset" aria-label="Reset"></button>
          <button type="button" id="drawBtn" class="btn toggle" aria-pressed="false" title="Draw on the canvas" aria-label="Draw"></button>
          <span class="spacer"></span>
          <button type="button" id="exportBtn" class="btn ghost" title="Save as PNG" aria-label="Save as PNG"></button>
          <button type="button" id="shareBtn" class="btn ghost" title="Copy a link to this pattern" aria-label="Copy link"></button>
        </div>
      </div>

      <div class="sliders">
        <label class="slider">
          <span class="slider-head">Speed <output id="speedOut"></output></span>
          <input type="range" id="speed" min="0" max="10" step="1">
        </label>
        <label class="slider">
          <span class="slider-head">Cell size <output id="cellOut"></output></span>
          <input type="range" id="cell" min="1" max="12" step="1">
        </label>
      </div>

      <p class="status" id="status"></p>
    </div>

    <aside class="panel" aria-labelledby="algoName">
      <h1 id="algoName" class="panel-title"></h1>
      <p id="algoTagline" class="tagline"></p>
      <div id="params" class="params"></div>
      <div id="info" class="info"></div>
    </aside>
  </main>

  <section class="wrap about" id="about"></section>

  <footer class="wrap footer">
    <p><span class="kbd-tip">Keyboard: <kbd>Space</kbd> play/pause · <kbd>S</kbd> step · <kbd>R</kbd> reset. </span>Use the Link button to share exactly what you're looking at.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/algos/elementary.js"></script>
  <script src="js/algos/compare.js"></script>
  <script src="js/algos/totalistic.js"></script>
  <script src="js/algos/traffic.js"></script>
  <script src="js/algos/life.js"></script>
  <script src="js/algos/ant.js"></script>
  <script src="js/algos/cyclic.js"></script>
  <script src="js/algos/wireworld.js"></script>
  <script src="js/algos/snowflake.js"></script>
  <script src="js/algos/reaction.js"></script>
  <script src="js/algos/hodgepodge.js"></script>
  <script src="js/algos/dla.js"></script>
  <script src="js/algos/sandpile.js"></script>
  <script src="js/algos/forest.js"></script>
  <script src="js/algos/ising.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
