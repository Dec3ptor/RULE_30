<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule 30 Simulation</title>
    <!-- Add Tailwind CSS CDN -->
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-blue-50">
    <div class="flex flex-col md:flex-row items-center space-y-2 md:space-x-4">
        <!-- Title and Webpage Links -->
        <div class="w-full max-w-screen-xl text-center p-4">
            <h1 class="text-3xl font-semibold mb-2">Cellular Automata</h1>
            <div class="text-blue-500">
                <!-- Add your webpage links here if needed -->
            </div>
        </div>
        
        <!-- Canvas on the Left -->
        <div class="md:w-1/2 w-full h-screen flex justify-center items-center">
            <canvas id="rule30Canvas" class="border border-gray-500"></canvas>
            <p id="ruleDescription" class="mt-4"></p>
        </div>

        <!-- Controls on the Right -->
        <div class="md:w-1/2 w-full p-4">
            <!-- <button id="frequencyAnalysisBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md mb-2">Frequency Analysis</button> -->
            <input type="number" id="ruleInput" min="0" max="255" step="1" value="30" placeholder="Enter Rule Number" class="border border-gray-400 px-2 py-1 rounded-md mb-2">
            <button id="applyRuleBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md mb-2">Apply Rule</button>
            <label for="customGenerations" class="mt-4">Generations:</label>
            <input type="number" id="customGenerations" value="50" min="1" class="border border-gray-400 px-2 py-1 rounded-md mb-2">
            <label for="customCellSize">Cell Size (pixels):</label>
            <input type="number" id="customCellSize" value="5" min="1" class="border border-gray-400 px-2 py-1 rounded-md mb-2">

            <input type="number" id="ruleInput1" min="0" max="255" step="1" value="30" placeholder="Enter Rule Number" class="border border-gray-400 px-2 py-1 rounded-md mb-2">
            <input type="number" id="ruleInput2" min="0" max="255" step="1" value="86" placeholder="Enter Rule Number" class="border border-gray-400 px-2 py-1 rounded-md mb-2">
            <button id="compareRulesBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md mb-2">Compare Rules</button>
            <label for="flipRule">Flip Rule (0: None, 1: Rule 1, 2: Rule 2):</label>
            <input type="number" id="flipRule" min="0" max="2" step="1" value="0" class="border border-gray-400 px-2 py-1 rounded-md mb-2">
            <button id="exportBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md mb-2">Export as PNG</button>
        </div>
    </div>
    <script src="content.js"></script>
</body>
</html>
